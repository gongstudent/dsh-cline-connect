# dsh bundle patch: mounts the self-contained Cline provider.
#
# The row is host-plane: it registers an LLM provider route on the harness LLM
# seam (so `cline-free/*` and `cline-pass/*` models appear to every agent and to
# the model picker) and registers the `cline_connect_*` management tools.
#
# Defaults are ready to use: base URL https://api.cline.bot/api/v1, one route
# named `cline-connect`, and the API key read from the CLINE_API_KEY credential/env.
# Override any of it in your profile's own
# $DSH_HOME/profiles/<name>/cordis.patch.yml, which is applied after every
# bundle layer:
#
# - id: cline-connect
#   config:
#     apiKeyEnv: CLINE_API_KEY
#     exposeTools: true
#
# NOTE: the route is deliberately NOT named `cline-pass` (so this plugin can
# coexist with dsh-cline-pass during migration) and NOT named `cline` either:
# `@deepseek-ai/dsh-llm-pi-ai` keys its provider routes by the `providers` dict,
# so a pi-ai `cline` entry - the common hand-rolled free-model workaround - would
# collide here. Two adapters on one route is rejected as DUPLICATE_ADAPTER.

- insert:
    - id: cline-connect
      name: dsh-cline-connect
